<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1280" height="640" fill="#111111"/>

  <defs>
    <linearGradient id="barGlow" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#c58a3c" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#c58a3c" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#c58a3c" stop-opacity="0"/>
      <stop offset="0.8" stop-color="#c58a3c" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#c58a3c" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- slim top bar -->
  <rect x="0" y="0" width="1280" height="40" fill="#161616"/>
  <rect x="0" y="39" width="1280" height="1" fill="url(#barGlow)"/>

  <!-- workspaces: focused one is wider -->
  <circle cx="24" cy="20" r="5" fill="#5a5a5a"/>
  <circle cx="44" cy="20" r="5" fill="#5a5a5a"/>
  <circle cx="64" cy="20" r="5" fill="#5a5a5a"/>
  <rect x="78" y="15" width="34" height="10" rx="5" fill="#b07a35"/>
  <circle cx="130" cy="20" r="5" fill="#5a5a5a"/>

  <!-- clock and notification bell -->
  <text x="640" y="27" text-anchor="middle" font-family="monospace" font-size="19" font-weight="700" fill="#c8c8c8">20:48</text>
  <path transform="translate(694,20)" d="M0 -9 C-4 -9 -6 -6 -6 -3 L-6 2 L-8 5 L8 5 L6 2 L6 -3 C6 -6 4 -9 0 -9 Z M-2.5 7 a2.5 2.5 0 0 0 5 0 Z" fill="#8a6a35"/>

  <!-- tray: wifi, bluetooth, volume, menu -->
  <path transform="translate(1176,20)" d="M0 8 L-10 -4 A14 14 0 0 1 10 -4 Z" fill="#c8c8c8"/>
  <path transform="translate(1210,20)" d="M-4 -5 L5 4 L0 8 L0 -8 L5 -4 L-4 5" fill="none" stroke="#c8c8c8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(1242,20)">
    <path d="M-8 -3 H-4 L1 -8 V8 L-4 3 H-8 Z" fill="#c8c8c8"/>
    <path d="M4 -4 A6 6 0 0 1 4 4" fill="none" stroke="#c8c8c8" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  <circle cx="1264" cy="12" r="2" fill="#c8c8c8"/>
  <circle cx="1264" cy="20" r="2" fill="#c8c8c8"/>
  <circle cx="1264" cy="28" r="2" fill="#c8c8c8"/>

  <!-- the rat -->
  <g transform="translate(230,250)">
    <!-- tail -->
    <path d="M 54 128 C 0 135, -30 175, -85 152 S -150 100, -118 66" fill="none" stroke="#b5736a" stroke-width="6" stroke-linecap="round"/>
    <!-- far legs -->
    <path d="M 255 140 L 262 172 L 278 176" fill="none" stroke="#555555" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 120 142 L 108 170 L 124 175" fill="none" stroke="#555555" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- body -->
    <path d="M 50 135 C 60 85, 130 65, 200 72 C 250 76, 280 88, 310 100 L 372 124 C 376 128, 374 133, 368 134 L 310 142 C 270 150, 200 152, 140 150 C 90 150, 55 148, 50 135 Z" fill="#c8c8c8"/>
    <!-- belly highlight -->
    <path d="M 100 140 C 160 148, 250 146, 305 136" fill="none" stroke="#e6e6e6" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
    <!-- near legs -->
    <path d="M 285 140 L 296 172 L 314 176" fill="none" stroke="#c8c8c8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 90 140 L 74 170 L 92 175" fill="none" stroke="#c8c8c8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- ear -->
    <circle cx="272" cy="86" r="22" fill="#c8c8c8"/>
    <circle cx="272" cy="86" r="14" fill="#b5736a"/>
    <!-- eye -->
    <circle cx="320" cy="108" r="6" fill="#111111"/>
    <circle cx="322" cy="106" r="2" fill="#ffffff"/>
    <!-- nose -->
    <circle cx="371" cy="127" r="6" fill="#c58a3c"/>
    <!-- whiskers -->
    <g stroke="#c9985a" stroke-width="2" stroke-linecap="round">
      <line x1="345" y1="128" x2="400" y2="112"/>
      <line x1="345" y1="132" x2="402" y2="130"/>
      <line x1="345" y1="136" x2="398" y2="148"/>
    </g>
  </g>

  <!-- ground line -->
  <rect x="80" y="430" width="560" height="4" rx="2" fill="#3a3d42"/>

  <!-- title -->
  <text x="690" y="305" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="108" font-weight="700" letter-spacing="-2" textLength="540" lengthAdjust="spacingAndGlyphs">
    <tspan fill="#c58a3c">Slim</tspan><tspan fill="#c8c8c8">shell</tspan>
  </text>
  <text x="694" y="365" font-family="monospace" font-size="32" fill="#8a8a8a">a slim Quickshell config</text>
  <rect x="694" y="395" width="120" height="4" rx="2" fill="#c9985a"/>
</svg>
