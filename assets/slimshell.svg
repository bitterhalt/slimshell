<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">SlimShell</title>
  <desc id="desc">SlimShell logo with gold Slim, off-white Shell, subtitle and straight gold underline on a #101010 background.</desc>
  <rect width="1600" height="420" fill="#101010"/>
  <g font-family="DejaVu Sans, sans-serif" font-weight="bold" font-size="120" letter-spacing="-5">
    <text x="800" y="194" text-anchor="end" fill="#E7AA50">Slim</text>
    <text x="800" y="194" text-anchor="start" fill="#E6E6E6">Shell</text>
  </g>
  <text x="800" y="261" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="38" letter-spacing="0.4" fill="#BFBFBF">a slim Quickshell config</text>
  <line x1="380" y1="298" x2="1220" y2="298" stroke="#E7AA50" stroke-width="8" stroke-linecap="round"/>
</svg>
